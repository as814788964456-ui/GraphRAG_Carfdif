services:
  neo4j:
    image: neo4j:5.26-community
    container_name: graphrag-neo4j
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/graphrag-password
      NEO4J_PLUGINS: '["apoc"]'   # neo4j-graphrag 建圖譜需要 APOC
      NEO4J_server_memory_heap_max__size: 2G
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data:
